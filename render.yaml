# Render blueprint for the OANDA Flip Bot - ONE service / ONE command.
#
# Background Workers are NOT available on Render's free (Hobby) plan, so this
# runs the trading bot, the Telegram daemon, and the dashboard together in a
# single free WEB SERVICE via one start command (bash start.sh). Because all
# three share the same container/filesystem, state.json and control.json are
# shared, so Telegram (telegram_bot.py) fully controls the live bot (bot.py).
#
# NOTE: free web services spin down after ~15 min of no HTTP traffic. To keep a
# bot running 24/7 for free, point a free UptimeRobot monitor at the service URL
# (ping every 5 min). For a guaranteed always-on loop, use a paid plan or a VM.
#
# Secrets (OANDA_API_TOKEN, OANDA_ACCOUNT_ID, TELEGRAM_TOKEN, ALLOWED_USERS)
# are set in the Render dashboard under this service's "Environment" tab.
services:
  - type: web
    name: flip-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /
    envVars:
      - key: OANDA_API_TOKEN
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ALLOWED_USERS
        value: ""
      - key: OANDA_ENV
        value: practice
      - key: OANDA_INSTRUMENT
        value: EUR_USD
      - key: ENTRY_MODE
        value: straddle
      - key: STARTING_BALANCE
        value: "1.00"
      - key: MAX_LOSS
        value: "100.00"
      - key: PROFIT_TARGET
        value: "100.00"
      - key: UNITS
        value: "1000"
      - key: OFFSET_PIPS
        value: "15"
      - key: POLL_INTERVAL
        value: "5"
